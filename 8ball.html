<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>8H-News – Magic 8-Ball">

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<base href="/8H-news/">
  
<body>

<div class="ticker">
  <div class="ticker-track">
    <span>Magic 8-Ball</span>
    <span>Ask your question</span>
    <span>Chaos-powered predictions</span>
  </div>
</div>

<header class="masthead">
  <div class="masthead-inner">
    <div class="masthead-top">
      <span>Rainharp House</span>
      <span>NSW, Australia</span>
    </div>

    <h1 class="title">8H<span>News</span></h1>
    <p class="tagline">Magic 8-Ball</p>

    <div class="masthead-bottom">
      <div class="rule"></div>
      <div class="rule"></div>
    </div>

    <p class="desc">Ask the legendary 8H-News Magic 8-Ball anything. It will answer with 100% accuracy, 0% responsibility.</p>
  </div>
</header>

<nav class="navbar">
  <a href="index.html">Front Page</a>
  <a href="weekly.html">Weekly</a>
  <a href="8ball.html" class="active">8-Ball</a>
  <a href="lore.html">Lore</a>
  <a href="weather.html">Weather</a>
  <a href="review.html">Review</a>
  <a href="archive.html">Archive</a>
  <a href="#" id="nav-signin">Sign In</a>
  <span id="nav-account" style="display:none;"></span>
</nav>

<main class="front-page">

  <section class="section-head">
    <h2 class="section-title">Ask the 8-Ball</h2>
    <p class="dek">Type your question below and let fate decide your destiny.</p>
  </section>

  <div class="grid single-col">

    <div class="story">
      <h3>Magic 8-Ball</h3>
      <p class="dek">Enter your question:</p>

      <input id="question-input" 
             type="text" 
             placeholder="Will I survive Year 8?" 
             style="padding:0.6rem; width:100%; margin:0.5rem 0; font-size:1rem;">

      <button id="ask-btn"
              style="padding:0.7rem 1rem; background:var(--ink); color:var(--paper); border:none; cursor:pointer; font-family:'IBM Plex Mono', monospace; text-transform:uppercase; letter-spacing:0.08em;">
        Ask
      </button>

      <p id="answer-output" 
         style="margin-top:1rem; font-size:1.3rem; font-style:italic; color:var(--red); min-height:2rem;">
      </p>
    </div>

  </div>

</main>

<footer class="site-footer">
  <p>© 2026 8H-News</p>
  <p class="fine-print">Made by Will</p>
</footer>

<div id="login-popup" class="login-popup" style="display:none;">
  <div class="login-dialog">

    <button id="login-later">Sign in later</button>

    <h2 class="hed">Sign in to 8H-News</h2>
    <p class="dek">Log in or create an account.</p>

    <div class="login-columns">

      <form id="login-form" class="login-form">
        <h3 class="hed-sm">Log in</h3>
        <label>Email</label>
        <input type="email" id="login-email" required>

        <label>Password</label>
        <input type="password" id="login-password" required>

        <button type="submit">Sign In</button>
      </form>

      <form id="register-form" class="login-form">
        <h3 class="hed-sm">Create account</h3>
        <label>Email</label>
        <input type="email" id="register-email" required>

        <label>Password</label>
        <input type="password" id="register-password" required>

        <button type="submit">Register</button>
      </form>

    </div>
  </div>
</div>

<script type="module" src="app.js"></script>

<script>
const answers = [
  "It is certain.",
  "Without a doubt.",
  "You may rely on it.",
  "Yes — definitely.",
  "As I see it, yes.",
  "Most likely.",
  "Outlook good.",
  "Signs point to yes.",
  "Reply hazy, try again.",
  "Ask again later.",
  "Better not tell you now.",
  "Cannot predict now.",
  "Concentrate and ask again.",
  "Don't count on it.",
  "My reply is no.",
  "Outlook not so good.",
  "Very doubtful."
];

document.getElementById("ask-btn").addEventListener("click", () => {
  const question = document.getElementById("question-input").value.trim();
  const output = document.getElementById("answer-output");

  if (!question) {
    output.textContent = "You must ask a question.";
    return;
  }

  const randomAnswer = answers[Math.floor(Math.random() * answers.length)];
  output.textContent = randomAnswer;
});
</script>

</body>
</html>
