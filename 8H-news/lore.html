  <section class="section-head">
    <h2 class="section-title">Lore of 8H</h2>
    <p class="dek">These are the stories that shaped the culture of 8H — dramatic, hilarious, and occasionally questionable.</p>
  </section>

  <div class="grid single-col">

    <div class="story">
      <h3>The Great Pencil Heist</h3>
      <p class="dek">A mysterious figure stole 14 pencils in one day. No fingerprints. No witnesses. Only chaos.</p>
    </div>

    <div class="story">
      <h3>The Legend of Isaac</h3>
      <p class="dek">Single. Ready to mingle. Possibly with Awa. (He denies everything.)</p>
    </div>

    <div class="story">
      <h3>The Fall of Awa</h3>
      <p class="dek">Awa’s reign of classroom dominance ended abruptly after the Great Chromebook Incident.</p>
    </div>

    <div class="story">
      <h3>The Chair Flip of 2026</h3>
      <p class="dek">A chair was flipped. A scream was heard. The room fell silent. History was made.</p>
    </div>

    <div class="story">
      <h3>The Forbidden Corner</h3>
      <p class="dek">A corner of the classroom that no one enters. Rumor says it contains a lost assignment from 2023.</p>
    </div>

  </div>
