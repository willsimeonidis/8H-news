<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>8H-News – Front Page</title>

  <!-- Your CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- REQUIRED: Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-left">
      <a href="index.html" class="nav-link active">Front Page</a>
      <a href="weekly.html" class="nav-link">Weekly</a>
      <a href="8ball.html" class="nav-link">8-Ball</a>
      <a href="lore.html" class="nav-link">Lore</a>
      <a href="weather.html" class="nav-link">Weather</a>
      <a href="review.html" class="nav-link">Review</a>
      <a href="archive.html" class="nav-link">Archive</a>
    </div>

    <div class="nav-right">
      <a href="#" id="nav-signin" class="nav-link nav-signin">Sign In</a>
      <span id="nav-account" class="nav-account" style="display:none;"></span>
    </div>
  </nav>

  <!-- Main content -->
  <main class="layout">
    <h1 class="hed">Welcome to 8H-News</h1>
    <p class="dek">Add your stories later — this page is just the working template.</p>
  </main>

  <!-- REQUIRED: Login popup -->
  <div id="login-popup" class="login-popup" style="display:none;">
    <div class="login-dialog">
      <button class="login-close" id="login-later">×</button>

      <h2 class="hed">Sign in to 8H-News</h2>
      <p class="dek">Log in or create an account.</p>

      <div class="login-columns">

        <!-- Login -->
        <form id="login-form" class="login-form">
          <h3 class="hed-sm">Log in</h3>
          <label>Email</label>
          <input type="email" id="login-email" required>

          <label>Password</label>
          <input type="password" id="login-password" required>

          <button type="submit" class="btn primary">Sign In</button>
        </form>

        <!-- Register -->
        <form id="register-form" class="login-form">
          <h3 class="hed-sm">Create account</h3>
          <label>Email</label>
          <input type="email" id="register-email" required>

          <label>Password</label>
          <input type="password" id="register-password" required>

          <button type="submit" class="btn">Register</button>
        </form>

      </div>
    </div>
  </div>

  <!-- REQUIRED: app.js -->
  <script type="module" src="app.js"></script>

</body>
</html>
