<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>8H-News – Front Page</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="masthead">
  <h1 class="title">8H<span>News</span></h1>
  <p class="tagline">Front Page</p>
</header>

<nav class="navbar">
  <a href="index.html" class="active">Front Page</a>
  <a href="weekly.html">Weekly</a>
  <a href="8ball.html">8-Ball</a>
  <a href="lore.html">Lore</a>
  <a href="weather.html">Weather</a>
  <a href="review.html">Review</a>
  <a href="archive.html">Archive</a>
  <a href="#" id="nav-signin">Sign In</a>
  <span id="nav-account" style="display:none;"></span>
</nav>

<main>
  <h2>Top Stories</h2>
  <p>Bathurst High’s fastest, loudest, and most dangerously honest student‑run news outlet.</p>
</main>

<footer class="site-footer">
  <p>© 2026 8H-News – Made by Will</p>
</footer>

<!-- Login popup -->
<div id="login-popup" class="login-popup" style="display:none;">
  <div class="login-dialog">
    <button id="login-later" class="close-btn">Sign in later</button>

    <h2>Sign in to 8H-News</h2>
    <p>Log in or create an account.</p>

    <div class="login-columns">
      <form id="login-form" class="login-form">
        <h3>Log in</h3>
        <label>Email</label>
        <input type="email" id="login-email" required>

        <label>Password</label>
        <input type="password" id="login-password" required>

        <button type="submit">Sign In</button>
      </form>

      <form id="register-form" class="login-form">
        <h3>Create account</h3>
        <label>Email</label>
        <input type="email" id="register-email" required>

        <label>Password</label>
        <input type="password" id="register-password" required>

        <button type="submit">Register</button>
      </form>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
